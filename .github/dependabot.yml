# Dependabot configuration for the Iglu/SupportPlan fork.
#
# Scans composer.json + composer.lock for vulnerable PHP packages and the
# GitHub Actions workflows for outdated pinned actions. Opens PRs against
# main-iglu. The cve-tracker matrix's "Repo Alerts" tab pulls these via
# the GitHub API.

version: 2

updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: daily
      time: "02:00"
      timezone: "Europe/London"
    target-branch: main-iglu
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - composer
    commit-message:
      prefix: "deps"
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    target-branch: main-iglu
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: "ci"
